name: Verifica add-on
on:
  pull_request:
    paths:
      - 'ghiro_preventivi/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/check-addon.yml'
  push:
    branches: [main]
    paths:
      - 'ghiro_preventivi/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/check-addon.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa il motore PDF per i test
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install "reportlab>=4.2,<5" "openpyxl>=3.1.5,<4" "defusedxml>=0.7.1,<1"
      - name: Verifica JavaScript delle pagine
        run: |
          node tools/check_frontend.mjs
          node tools/check_apartments.mjs
      - name: Verifica Python e salvataggi su dati temporanei
        run: python -m unittest discover -s tests -v
      - name: Prepara Chromium per le verifiche browser
        run: |
          npm install --prefix /tmp/ghiro-browser playwright@1.51.1 --no-audit --no-fund
          /tmp/ghiro-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verifica configuratore, editor e stampa nel browser
        env:
          GHIRO_PLAYWRIGHT: /tmp/ghiro-browser/node_modules/playwright
        run: node tools/check_browser.cjs
      - name: Conserva le anteprime della verifica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: browser-artifacts/
          if-no-files-found: ignore
      - name: Costruisci l’immagine add-on e verifica il supporto PDF
        run: |
          docker build -t ghiro-pdf-test ./ghiro_preventivi
          docker run --rm --entrypoint python3 ghiro-pdf-test -c "from excel_quote import build_quote; import io,zipfile; data=build_quote({'righe':[{'descrizione':'Quadro','prezzo':100,'quantita':1}]}); assert zipfile.ZipFile(io.BytesIO(data)).testzip() is None; print('Excel export OK')"
          docker run --rm --entrypoint python3 -v "${{ github.workspace }}/tests/fixtures:/fixtures:ro" ghiro-pdf-test -c "import base64,tempfile,pathlib; from pdf_plan import import_pdf; folder=tempfile.TemporaryDirectory(); result=import_pdf(folder.name,'prova.pdf',base64.b64encode(pathlib.Path('/fixtures/planimetria.pdf').read_bytes()).decode()); assert result['pagine']==2; print('PDF conversion OK'); folder.cleanup()"
          docker run --rm --entrypoint python3 ghiro-pdf-test -c "from pdf_client_quote import build_client_quote; data=build_client_quote({'righe':[{'descrizione':'Quadro','prezzo':100,'quantita':1}]},'/app/logo.jpg'); assert data.startswith(b'%PDF-'); print('Customer PDF OK')"
