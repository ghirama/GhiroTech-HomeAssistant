name: Importa pacchetto add-on
on:
  push:
    branches: [main]
    paths:
      - 'GhiroTech_HA_Addon_v*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Estrai ultima versione caricata
        shell: bash
        run: |
          set -euo pipefail
          latest=$(find . -maxdepth 1 -name 'GhiroTech_HA_Addon_v*.zip' -printf '%f\n' | sort -V | tail -n 1)
          test -n "$latest"
          unzip -o "$latest" -d .
          test -f ghiro_preventivi/config.yaml
          test -f ghiro_preventivi/Dockerfile
          test -f ghiro_preventivi/app.py
          test -f ghiro_preventivi/index.html
          test -f ghiro_preventivi/prezzario.sqlite
      - name: Pubblica add-on
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ghiro_preventivi
          if ! git diff --cached --quiet; then
            git commit -m 'Pubblica add-on Home Assistant da ZIP'
            git push
          fi
