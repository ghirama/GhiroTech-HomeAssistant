<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor planimetria</title>
<style>body{font:15px system-ui;margin:0;background:#eef2f5;color:#183a4b}header,aside{padding:14px;background:#163c50;color:white}header{display:flex;gap:12px;align-items:center}main{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px}aside{display:grid;gap:9px;align-content:start;border-radius:8px}input,select,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{cursor:pointer}#board{position:relative;background:white;min-height:65vh;border:1px solid #aabbc5;touch-action:none}#plan{width:100%;height:100%;position:absolute;object-fit:contain;pointer-events:none}.symbol{position:absolute;transform:translate(-50%,-50%);background:white;border:2px solid #267b9b;border-radius:6px;min-width:30px;min-height:30px;touch-action:none}.symbol.on{border-color:#ec8b2e}dialog{border:0;border-radius:10px;max-width:90vw}#rooms button{margin:3px}small{color:#cde0e7}@media(max-width:700px){main{grid-template-columns:1fr}#board{min-height:55vh}}</style>
<header><b>Ghiro Tech · Planimetria</b><a style="color:white" href="./">Gestionale</a><button onclick="save()">Salva</button><span id="msg"></span></header><main><aside>
<label>Progetto <input id="title" value="Nuovo impianto"></label><label>Planimetria JPG/PNG <input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label>
<small>La planimetria viene salvata insieme alle stanze nel database del gestionale.</small>
<label>Configurazione <select id="projects" onchange="selectProject(this.value)"><option value="">Nuova configurazione</option></select></label><button onclick="newProject()">+ Nuovo progetto</button><button onclick="newRoom()">+ Stanza</button><div id="rooms"></div>
<label>Simbolo <select id="type"><option value="presa">Presa</option><option value="luce">Luce</option><option value="comando">Scatola comandi</option><option value="tv">TV</option><option value="termostato">Termostato</option><option value="quadro">Quadro</option><option value="citofono">Videocitofono</option></select></label>
<button onclick="placing=true;message('Tocca la planimetria')">+ Inserisci punto</button><button onclick="del()">Elimina selezionato</button><div id="totals"></div></aside>
<section><div id="board"><img id="plan"><div id="symbols"></div></div><p>Tocca un simbolo per selezionarlo, trascinalo per spostarlo. Tocca una scatola per comporla.</p></section></main>
<dialog id="box"><h3>Composizione scatola</h3><label>Serie <select id="series"><option>Vimar Plana</option><option>Vimar Arké</option><option>Vimar Linea</option><option>BTicino Livinglight</option><option>BTicino Living Now</option></select></label>
<label>Scatola <select id="capacity"><option value="3">503</option><option value="4">504</option><option value="6">506</option><option value="7">507</option></select></label>
<p id="fruits"></p><select id="fruit"><option>Interruttore</option><option>Deviatore</option><option>Invertitore</option><option>Pulsante</option><option>Presa</option><option>Tappo</option></select><button onclick="fruitAdd()">+ Frutto</button><button onclick="fruitRemove()">− Ultimo</button><p><small style="color:#555">Ingombri indicativi: verificare compatibilità e codici produttore.</small></p><button onclick="boxClose()">Conferma</button></dialog>
<script>
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID();let allProjects=[];let rooms=[{id:uid(),name:'Soggiorno',items:[]}],active=rooms[0].id,selected=null,placing=false,configId=null;
const room=()=>rooms.find(r=>r.id===active),item=()=>room().items.find(i=>i.id===selected),message=s=>$('msg').textContent=s;
function draw(){$('plan').src=rooms.find(r=>r.planImage)?.planImage||'';let wrap=$('rooms');wrap.replaceChildren();rooms.forEach(r=>{let b=document.createElement('button');b.textContent=(r.id===active?'● ':'○ ')+r.name;b.onclick=()=>{active=r.id;selected=null;draw()};wrap.append(b);let copy=document.createElement('button');copy.textContent='⧉';copy.title='Duplica stanza';copy.onclick=()=>{let c=structuredClone(r);c.id=uid();c.name+=' copia';c.items.forEach(i=>i.id=uid());rooms.push(c);active=c.id;draw()};wrap.append(copy)});
$('symbols').replaceChildren();room().items.forEach(i=>{let b=document.createElement('button');b.className='symbol'+(i.id===selected?' on':'');b.style.left=i.x+'%';b.style.top=i.y+'%';b.textContent=({presa:'P',luce:'☼',comando:'C',tv:'TV',termostato:'T',quadro:'QE',citofono:'VC'})[i.type];let dragged=false;b.onpointerdown=e=>{dragged=false;b.setPointerCapture(e.pointerId)};b.onpointermove=e=>{if(!b.hasPointerCapture(e.pointerId))return;dragged=true;Object.assign(i,coords(e));b.style.left=i.x+'%';b.style.top=i.y+'%'};b.onpointerup=()=>{selected=i.id;draw();if(!dragged&&i.type==='comando')boxOpen()};$('symbols').append(b)});
let counts={};rooms.forEach(r=>r.items.forEach(i=>counts[i.type]=(counts[i.type]||0)+1));$('totals').textContent=Object.entries(counts).map(([k,v])=>k+': '+v).join(' · ')}
function coords(e){let r=$('board').getBoundingClientRect();return{x:Math.max(0,Math.min(100,100*(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(100,100*(e.clientY-r.top)/r.height))}}
$('board').onclick=e=>{if(!placing||e.target.closest('.symbol'))return;let i={id:uid(),type:$('type').value,...coords(e),series:'Vimar Plana',capacity:3,fruits:[]};room().items.push(i);selected=i.id;placing=false;draw();if(i.type==='comando')boxOpen()};
function newRoom(){let name=prompt('Nome stanza');if(!name?.trim())return;let r={id:uid(),name:name.trim(),items:[],planImage:rooms.find(x=>x.planImage)?.planImage||''};rooms.push(r);active=r.id;draw()}function del(){if(!selected)return;room().items=room().items.filter(i=>i.id!==selected);selected=null;draw()}
function boxOpen(){let i=item();$('series').value=i.series;$('capacity').value=i.capacity;fruitDraw();$('box').showModal()}function fruitDraw(){$('fruits').textContent=(item().fruits||[]).join(' | ')||'Scatola vuota'}
function fruitAdd(){let i=item();if(i.fruits.length>=Number($('capacity').value))return alert('Scatola piena');i.fruits.push($('fruit').value);fruitDraw()}function fruitRemove(){item().fruits.pop();fruitDraw()}function boxClose(){let i=item();if(i.fruits.length>Number($('capacity').value))return alert('Troppi moduli');i.capacity=Number($('capacity').value);i.series=$('series').value;$('box').close();draw()}
$('upload').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1e6)return alert('Massimo 1 MB per immagine; riduci la risoluzione');let rd=new FileReader();rd.onload=()=>{rooms.forEach(r=>r.planImage=rd.result);$('plan').src=rd.result;message('Planimetria caricata: premi Salva')};rd.readAsDataURL(f)};
async function save(){try{let r=await fetch('api/configurazioni',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:configId,titolo:$('title').value,stanze:rooms})}),d=await r.json();if(!r.ok)throw Error(d.errore);let old=configId;configId=d.id;allProjects=await (await fetch('api/configurazioni')).json();populateProjects();if(!old)message('Nuova configurazione salvata')message('Salvato #'+configId)}catch(e){message('Errore: '+e.message)}}
function populateProjects(){$('projects').replaceChildren(new Option('Nuova configurazione',''));allProjects.forEach(p=>$('projects').add(new Option(p.titolo+' #'+p.id,String(p.id))));$('projects').value=configId||''}
function newProject(){configId=null;rooms=[{id:uid(),name:'Soggiorno',items:[]}];active=rooms[0].id;selected=null;$('title').value='Nuovo impianto';$('plan').removeAttribute('src');populateProjects();draw()}
function selectProject(id){if(!id)return newProject();let p=allProjects.find(p=>String(p.id)===String(id));if(!p)return;let data;try{data=JSON.parse(p.stanze_json)}catch{return message('Configurazione non valida')};if(!Array.isArray(data)||!data.length)return message('Nessuna stanza disponibile');rooms=data;active=rooms[0].id;selected=null;configId=p.id;$('title').value=p.titolo;$('plan').src=rooms[0].planImage||'';draw()}
async function load(){try{let r=await fetch('api/configurazioni');if(!r.ok)throw Error('API');allProjects=await r.json();populateProjects();if(allProjects.length)selectProject(allProjects[0].id)}catch(e){message('Caricamento non disponibile')}draw()}load();
</script></html>
