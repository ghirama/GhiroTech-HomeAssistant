name: "Ghiro Tech Preventivi"
version: "0.9.46"
slug: "ghiro_preventivi"
description: "Preventivi elettrici e importazione listini EPPAT, Vimar e BTicino"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8765
panel_icon: mdi:calculator-variant
arch:
  - amd64
  - aarch64
  - armv7
map:
  - type: data
    read_only: false

  - type: share
    read_only: false
  - type: media
    read_only: false

# Port 8765 remains reserved for Home Assistant Ingress.
# Port 8766 is available for a Cloudflare Access JWT-protected Tunnel.
ports:
  8766/tcp: null
ports_description:
  8766/tcp: "GhiroTech external web (Cloudflare Access only)"
